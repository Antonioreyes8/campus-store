version: '3.8'

services:
  product-service:
    build: ./services/product-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}

  order-service:
    build: ./services/order-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PRODUCT_SERVICE_URL=http://product-service:8001
      - LAMBDA_URL=https://your-lambda-url.aws.com/default/order-logger
    depends_on:
      - product-service