# Force update for assignment 3

name: Cloud-Native CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Product Service Image
        run: docker build -t product-service ./services/product-service

      - name: Build Order Service Image
        run: docker build -t order-service ./services/order-service

      - name: Run Basic Tests
        run: |
          echo "Verifying service health..."
          echo "Build successful."

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Deploy to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/campus-store
            git pull origin main
            sudo docker-compose down
            sudo docker-compose up -d --build